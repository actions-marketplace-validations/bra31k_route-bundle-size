name: Route Bundle Size
description: Compare per-route First Load JS of a Next.js build against the merge base and fail on regression.
branding:
  icon: package
  color: blue

inputs:
  app-dir:
    description: Next.js app directory, relative to the repository root.
    required: false
    default: .
  install-command:
    description: Command that installs the app's dependencies.
    required: false
    default: npm ci
  build-command:
    description: Command that builds the app.
    required: false
    default: npx next build
  base:
    description: Git ref to compare against. Defaults to origin/<base branch of the pull request>.
    required: false
    default: ""
  package:
    description: npm spec of the CLI to install. Defaults to route-bundle-size at the version of this action.
    required: false
    default: ""
  analyze:
    description: Set to "true" to also run next analyze on the merge base and the head and upload the report as an artifact. Needs Next.js 16.4+.
    required: false
    default: "false"

outputs:
  report:
    description: Path to the markdown report file.
    value: ${{ steps.compare.outputs.report }}
  analyze-dir:
    description: Path to the bundle analyzer report folder. Empty when analyze is off or the analyzer failed.
    value: ${{ steps.analyze_base.outputs.dir }}

runs:
  using: composite
  steps:
    - name: Resolve head and merge base
      id: refs
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        BASE_INPUT: ${{ inputs.base }}
        PR_BASE_REF: ${{ github.base_ref }}
      run: |
        base="$BASE_INPUT"
        if [ -z "$base" ] && [ -n "$PR_BASE_REF" ]; then
          base="origin/$PR_BASE_REF"
        fi
        if [ -z "$base" ]; then
          echo "::error::No base ref to compare against. Set the 'base' input, for example 'base: origin/main'."
          exit 1
        fi
        if ! merge_base="$(git merge-base "$base" HEAD)" || [ -z "$merge_base" ]; then
          echo "::error::Could not find a merge base between '$base' and HEAD. Check out full history with actions/checkout and 'fetch-depth: 0'."
          exit 1
        fi
        echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "merge-base=$merge_base" >> "$GITHUB_OUTPUT"

    - name: Install route-bundle-size CLI
      id: cli
      shell: bash
      env:
        PACKAGE_INPUT: ${{ inputs.package }}
      run: |
        spec="$PACKAGE_INPUT"
        if [ -z "$spec" ]; then
          version="$(node -p 'require(process.argv[1]).version' "$GITHUB_ACTION_PATH/package.json")"
          spec="route-bundle-size@$version"
        fi
        prefix="$RUNNER_TEMP/route-bundle-size"
        npm install --prefix "$prefix" "$spec"
        echo "bin=$prefix/node_modules/.bin/route-bundle-size" >> "$GITHUB_OUTPUT"

    - name: Install dependencies at head
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: eval "$INSTALL_COMMAND"

    - name: Remove stale build stats
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      run: rm -f .next/diagnostics/route-bundle-stats.json

    - name: Build head
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: eval "$BUILD_COMMAND"

    - name: Measure head
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        CLI: ${{ steps.cli.outputs.bin }}
      run: '"$CLI" measure --app-dir . --out "$RUNNER_TEMP/route-bundle-size/current.json"'

    - name: Analyze head
      id: analyze_head
      if: inputs.analyze == 'true'
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      run: |
        rm -rf .next/diagnostics/analyze "$RUNNER_TEMP/route-bundle-size/analyze"
        if npx next analyze --output --snapshot head; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::next analyze failed at the head, so there is no bundle analyzer report. The analyzer needs Next.js 16.4 or newer. The size check is not affected."
        fi

    - name: Check out merge base
      id: checkout_base
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        MERGE_BASE: ${{ steps.refs.outputs.merge-base }}
      run: git checkout --force --detach "$MERGE_BASE"

    - name: Install dependencies at merge base
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: eval "$INSTALL_COMMAND"

    - name: Remove head build stats
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      run: rm -f .next/diagnostics/route-bundle-stats.json

    - name: Build merge base
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: eval "$BUILD_COMMAND"

    - name: Measure merge base
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        CLI: ${{ steps.cli.outputs.bin }}
      run: '"$CLI" measure --app-dir . --out "$RUNNER_TEMP/route-bundle-size/baseline.json"'

    - name: Analyze merge base
      id: analyze_base
      if: steps.analyze_head.outputs.ok == 'true'
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        APP_DIR: ${{ inputs.app-dir }}
      run: |
        if npx next analyze --output --snapshot base; then
          dir="$RUNNER_TEMP/route-bundle-size/analyze"
          rm -rf "$dir"
          cp -R .next/diagnostics/analyze "$dir"
          name="bundle-analyzer"
          if [ "$APP_DIR" != "." ]; then
            name="bundle-analyzer-$(printf '%s' "$APP_DIR" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::next analyze failed at the merge base, so there is no bundle analyzer report. The analyzer needs Next.js 16.4 or newer at both commits. The size check is not affected."
        fi

    - name: Return to head
      if: always() && steps.checkout_base.outcome != 'skipped'
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        HEAD_SHA: ${{ steps.refs.outputs.head }}
      run: git checkout --force --detach "$HEAD_SHA"

    - name: Upload bundle analyzer report
      id: analyze_upload
      if: steps.analyze_base.outputs.dir != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.analyze_base.outputs.name }}
        path: ${{ steps.analyze_base.outputs.dir }}
        retention-days: 7

    - name: Compare head with merge base
      id: compare
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        CLI: ${{ steps.cli.outputs.bin }}
        ANALYZE_URL: ${{ steps.analyze_upload.outputs.artifact-url }}
      run: |
        dir="$RUNNER_TEMP/route-bundle-size"
        report="$dir/report.md"
        rm -f "$report"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        status=0
        GITHUB_STEP_SUMMARY="$report" "$CLI" diff \
          --current "$dir/current.json" \
          --baseline "$dir/baseline.json" \
          --format markdown || status=$?
        if [ -f "$report" ]; then
          if [ -n "$ANALYZE_URL" ]; then
            printf '\n**Why did it change?** Download the [Next.js bundle analyzer report](%s), unzip it, run `npx serve <folder>` and open `/compare?from=snapshot:base&to=snapshot:head`.\n' "$ANALYZE_URL" >> "$report"
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
